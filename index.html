<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名前漢字化メーカー｜Ateji Name Maker</title>
<style>
  :root{
    --bg:#f6f3ee; --paper:#fffdfa; --ink:#201c19; --muted:#746b64;
    --line:#ded7cf; --accent:#8d2335; --accent2:#d8b06c; --shadow:0 18px 50px rgba(45,34,27,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); background:
    radial-gradient(circle at 15% 0%, #f2e4d6 0 18%, transparent 42%),
    radial-gradient(circle at 100% 20%, #efe2e3 0 15%, transparent 38%),
    var(--bg);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1050px;margin:auto;padding:46px 20px 70px}
  header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}
  .kicker{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:800;text-transform:uppercase}
  h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(34px,6vw,70px);line-height:.98;margin:8px 0 12px;letter-spacing:-.05em}
  .sub{color:var(--muted);font-size:14px;line-height:1.8;max-width:650px}
  .stamp{border:2px solid var(--accent);color:var(--accent);width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:900;transform:rotate(7deg);flex:0 0 auto}
  .panel{background:rgba(255,253,250,.88);backdrop-filter: blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:24px;padding:22px}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;margin:0 0 8px;color:#564d47}
  input,select,button{font:inherit}
  input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus{border-color:#b88b94;box-shadow:0 0 0 4px rgba(141,35,53,.08)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .actions{display:flex;gap:10px;align-items:end}
  button{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer;transition:.18s transform,.18s opacity,.18s box-shadow}
  button:hover{transform:translateY(-1px)}
  .primary{background:var(--accent);color:white;box-shadow:0 9px 20px rgba(141,35,53,.2);width:100%}
  .secondary{background:#efe9e3;color:#514741}
  .hint{font-size:11px;color:#897e76;margin-top:7px;line-height:1.6}
  .readingLine{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:15px;border-top:1px dashed var(--line)}
  .readingLine b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:22px}
  .results{margin-top:22px}
  .resultHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 2px 12px}
  .resultHead h2{margin:0;font-size:17px}
  #status{font-size:12px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:178px;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;right:-22px;top:-25px;width:80px;height:80px;border-radius:50%;border:1px solid #eadfd5}
  .rank{font-size:10px;color:#a3958b;letter-spacing:.12em;font-weight:800}
  .kanji{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:42px;line-height:1.2;letter-spacing:.04em;margin:8px 0 3px;word-break:break-all}
  .ruby{font-size:12px;color:var(--accent);font-weight:700}
  .meaning{font-size:12px;line-height:1.7;color:#655b54;margin-top:12px;min-height:40px}
  .copy{margin-top:12px;padding:8px 11px;border:1px solid var(--line);background:white;color:#4f4640;border-radius:10px;font-size:11px}
  footer{color:#8c8179;font-size:11px;line-height:1.7;margin-top:18px;padding:0 4px}
  .badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0e5e6;color:#7e2333;font-size:10px;font-weight:800}
  @media(max-width:780px){
    .grid,.row{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr}
    header{align-items:flex-start}.stamp{width:58px;height:58px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">ATEJI NAME MAKER</div>
      <h1>名前漢字化メーカー</h1>
      <div class="sub">欧米人の名前を、日本語の音に寄せながら漢字の当て字にします。英字から読みを自動推定し、必要ならカタカナだけ直して生成できます。</div>
    </div>
    <div class="stamp">名<br>漢字</div>
  </header>

  <section class="panel">
    <div class="grid">
      <div>
        <label for="name">NAME / 英字名</label>
        <input id="name" autocomplete="off" placeholder="例：Michael / Emily / Sophia / George" value="Michael">
        <div class="hint">一般的な名前は辞書優先。辞書にない名前は簡易的なローマ字読みで推定します。</div>
      </div>
      <div>
        <label for="style">STYLE / 雰囲気</label>
        <select id="style">
          <option value="natural">自然・上品</option>
          <option value="cool">クール・強め</option>
          <option value="bright">華やか・可愛い</option>
          <option value="classic">古風・和風</option>
          <option value="yankee">夜露死苦系</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="reading">READING / 読み（編集可）</label>
        <input id="reading" placeholder="マイケル">
        <div class="hint">発音が違うときは、ここをカタカナで直すと結果がかなり良くなります。</div>
      </div>
      <div class="actions">
        <button class="primary" id="make">漢字化する</button>
        <button class="secondary" id="shuffle" title="同じ読みで候補を作り直す">再抽選</button>
      </div>
    </div>

    <div class="readingLine">
      <span class="badge">推定読み</span>
      <b id="readingPreview">マイケル</b>
    </div>
  </section>

  <section class="results">
    <div class="resultHead">
      <h2>候補</h2>
      <span id="status">6案生成します</span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    ※これは「正式な漢字表記」ではなく、音と字義を楽しむ当て字ジェネレーターです。人名として実在する読み方だけに限定していません。<br>
    ※「夜露死苦系」は、音より世界観を優先することがあります。
  </footer>
</div>

let salt = 0;

function normalizeName(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");
}

function inferReading(name){
  const key = normalizeName(name);
  if(!key) return "";
  if(NAME_DICT[key]) return NAME_DICT[key];

  // 簡易フォールバック：英語発音の完全再現ではなく、ローマ字寄りの推定。
  let s = key
    .replace(/tion/g,"shon").replace(/sion/g,"zhon").replace(/ph/g,"f")
    .replace(/tch/g,"ch").replace(/sch/g,"sh").replace(/sh/g,"sy")
    .replace(/ch/g,"ty").replace(/th/g,"s").replace(/qu/g,"kw")
    .replace(/ck/g,"k").replace(/dge/g,"j").replace(/gi(?=[eiy])/g,"ji")
    .replace(/ge(?=[eiy])/g,"je").replace(/c(?=[eiy])/g,"s").replace(/c/g,"k")
    .replace(/x/g,"ks");

  const map = {
    kya:"キャ",kyu:"キュ",kyo:"キョ",sya:"シャ",syu:"シュ",syo:"ショ",tya:"チャ",tyu:"チュ",tyo:"チョ",
    nya:"ニャ",nyu:"ニュ",nyo:"ニョ",hya:"ヒャ",hyu:"ヒュ",hyo:"ヒョ",mya:"ミャ",myu:"ミュ",myo:"ミョ",
    rya:"リャ",ryu:"リュ",ryo:"リョ",gya:"ギャ",gyu:"ギュ",gyo:"ギョ",jya:"ジャ",jyu:"ジュ",jyo:"ジョ",
    bya:"ビャ",byu:"ビュ",byo:"ビョ",pya:"ピャ",pyu:"ピュ",pyo:"ピョ",
    fa:"ファ",fi:"フィ",fe:"フェ",fo:"フォ",va:"ヴァ",vi:"ヴィ",ve:"ヴェ",vo:"ヴォ",
    wi:"ウィ",we:"ウェ",wo:"ウォ",je:"ジェ",ti:"ティ",di:"ディ",
    ka:"カ",ki:"キ",ku:"ク",ke:"ケ",ko:"コ",sa:"サ",si:"シ",su:"ス",se:"セ",so:"ソ",
    ta:"タ",ti2:"チ",tu:"ツ",te:"テ",to:"ト",na:"ナ",ni:"ニ",nu:"ヌ",ne:"ネ",no:"ノ",
    ha:"ハ",hi:"ヒ",hu:"フ",he:"ヘ",ho:"ホ",ma:"マ",mi:"ミ",mu:"ム",me:"メ",mo:"モ",
    ya:"ヤ",yu:"ユ",yo:"ヨ",ra:"ラ",ri:"リ",ru:"ル",re:"レ",ro:"ロ",wa:"ワ",
    ga:"ガ",gi:"ギ",gu:"グ",ge:"ゲ",go:"ゴ",za:"ザ",zi:"ジ",zu:"ズ",ze:"ゼ",zo:"ゾ",
    da:"ダ",de:"デ",do:"ド",ba:"バ",bi:"ビ",bu:"ブ",be:"ベ",bo:"ボ",pa:"パ",pi:"ピ",pu:"プ",pe:"ペ",po:"ポ",
    a:"ア",i:"イ",u:"ウ",e:"エ",o:"オ",n:"ン"
  };

  let out="", i=0;
  while(i<s.length){
    let hit=null;
    for(const len of [3,2,1]){
      const part=s.slice(i,i+len);
      if(map[part]){hit=map[part]; i+=len; break;}
    }
    if(hit){out+=hit;continue;}
    // 子音単独は次の母音が無ければ「ウ」系で逃がす
    const c=s[i];
    const cons={k:"ク",g:"グ",s:"ス",z:"ズ",t:"ト",d:"ド",n:"ン",h:"フ",b:"ブ",p:"プ",m:"ム",r:"ル",l:"ル",f:"フ",v:"ヴ",j:"ジ",w:"ウ",y:"イ"};
    out += cons[c] || "";
    i++;
  }
  return out || key.toUpperCase();
}

function cleanKatakana(s){
  return s.trim().replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0)+0x60)).replace(/\s+/g,"");
}

function splitMora(kana){
  const small = new Set(["ャ","ュ","ョ","ァ","ィ","ゥ","ェ","ォ"]);
  const arr=[];
  for(const ch of kana){
    if(small.has(ch) && arr.length){ arr[arr.length-1]+=ch; }
    else if(ch==="ー" && arr.length){ arr[arr.length-1]+="ー"; }
    else if(ch==="ッ"){ arr.push("ッ"); }
    else arr.push(ch);
  }
  return arr;
}

function baseMora(m){
  return m.replace(/ー/g,"");
}

function seeded(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return ()=>{ h += 0x6D2B79F5; let t=h; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
}

function chooseForMora(m, style, rnd, pos){
  if(m==="ッ") return "";
  const b=baseMora(m);
  let choices = (KANJI[b] || KANJI[b[0]] || ["音"]).slice();
  const bias=STYLE_BIAS[style]||[];
  choices.sort((a,b2)=>{
    const ai=bias.indexOf(a), bi=bias.indexOf(b2);
    return (ai<0?99:ai)-(bi<0?99:bi);
  });
  const top = Math.min(choices.length, style==="yankee"?4:3);
  let chosen=choices[Math.floor(rnd()*top)];

  // 長音は「央」「王」「桜」などを足さず、前の漢字の読みを伸ばす扱い。
  if(m.includes("ー")) return chosen;

  return chosen;
}

function yankeeTransform(kana, rnd){
  if(YANKEE_SPECIAL[kana]) return YANKEE_SPECIAL[kana];
  const mora=splitMora(kana);
  const edgy = {
    "ヨ":"夜","ロ":"露","シ":"死","ク":"苦","ア":"愛","イ":"威","ラ":"羅","ブ":"武","ユ":"勇",
    "ヤ":"夜","マ":"魔","ド":"怒","ガ":"牙","リュ":"龍","リ":"理","ト":"闘","バ":"爆","コ":"虎",
    "レ":"零","アク":"悪","ゴク":"獄","ソウ":"魂","ジン":"神","テイ":"帝","オウ":"皇","ハ":"覇",
    "ジョ":"丈","ン":"恩","ル":"流","カ":"華","ミ":"魅","キ":"鬼","エ":"恵","ナ":"那","サ":"沙"
  };
  return mora.map(m=>edgy[baseMora(m)] || chooseForMora(m,"yankee",rnd,0)).join("");
}

function buildCandidate(kana, style, index){
  const rnd=seeded(kana+"|"+style+"|"+salt+"|"+index);
  if(style==="yankee") return yankeeTransform(kana,rnd);
  const mora=splitMora(kana);
  let out="";
  mora.forEach((m,i)=>{
    if(m==="ッ") return;
    out += chooseForMora(m,style,rnd,i);
  });
  return out;
}

function meaningText(word){
  const items=[...word].map(k=>MEANING[k]).filter(Boolean);
  const unique=[...new Set(items)].slice(0,4);
  return unique.length ? unique.join("・") : "音の響きを優先した当て字";
}

function make(){
  const name=document.getElementById("name").value.trim();
  let reading=cleanKatakana(document.getElementById("reading").value);
  if(!reading){
    reading=inferReading(name);
    document.getElementById("reading").value=reading;
  }
  document.getElementById("readingPreview").textContent=reading||"—";
  const style=document.getElementById("style").value;
  const cards=document.getElementById("cards");
  cards.innerHTML="";
  if(!reading){
    document.getElementById("status").textContent="名前か読みを入力してください";
    return;
  }
  const used=new Set();
  let tries=0;
  while(used.size<6 && tries<40){
    const k=buildCandidate(reading,style,tries);
    if(k) used.add(k);
    tries++;
  }
  [...used].slice(0,6).forEach((kanji,i)=>{
    const el=document.createElement("article");
    el.className="card";
    el.innerHTML=`
      <div class="rank">CANDIDATE ${String(i+1).padStart(2,"0")}</div>
      <div class="kanji">${kanji}</div>
      <div class="ruby">${reading}</div>
      <div class="meaning">${meaningText(kanji)}</div>
      <button class="copy" data-copy="${kanji}">コピー</button>`;
    cards.appendChild(el);
  });
  document.getElementById("status").textContent=`${name||reading} → ${reading}`;
}

function updateReading(){
  const name=document.getElementById("name").value;
  const inferred=inferReading(name);
  document.getElementById("reading").value=inferred;
  document.getElementById("readingPreview").textContent=inferred||"—";
}

document.getElementById("name").addEventListener("input",updateReading);
document.getElementById("reading").addEventListener("input",e=>{
  document.getElementById("readingPreview").textContent=cleanKatakana(e.target.value)||"—";
});
document.getElementById("make").addEventListener("click",make);
document.getElementById("shuffle").addEventListener("click",()=>{salt++;make();});
document.getElementById("style").addEventListener("change",make);
document.addEventListener("click",async e=>{
  if(e.target.matches("[data-copy]")){
    const t=e.target.dataset.copy;
    try{await navigator.clipboard.writeText(t);e.target.textContent="コピー済み";setTimeout(()=>e.target.textContent="コピー",900);}
    catch{prompt("コピーしてください",t);}
  }
});
document.getElementById("name").addEventListener("keydown",e=>{if(e.key==="Enter")make()});
document.getElementById("reading").addEventListener("keydown",e=>{if(e.key==="Enter")make()});

updateReading();
make();
</script>
